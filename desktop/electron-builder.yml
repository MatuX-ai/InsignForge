# InsightForge 桌面版打包配置
# 构建流程: build.mjs 负责编译后端/前端并组装 resources, 本文件负责 electron-builder 产物配置
#
# ⚠️ extraResources.filter 的语义:
#   electron-builder 把 filter 当作白名单集合传给 minimatch,
#   不带 ! 前缀的项是"必须匹配才能复制"的模式;
#   因此必须以 '**/*' 作为第一项明确表示"先全部包含",
#   再用 ! 前缀列出需要剔除的文件, 否则非 .map/.md 等文件会全部丢失.

appId: ai.insightforge.desktop
productName: InsightForge
copyright: Copyright © 2026 InsightForge

directories:
  # NSIS / portable 安装包统一输出到项目根 RELEASE/ 目录,
  # 不再使用 desktop/dist/; 后端与 rcedit 嵌入脚本路径见 desktop/build.mjs。
  output: ../RELEASE
  buildResources: build

files:
  - main.cjs
  - preload.cjs
  # main.cjs 在 v1.7+ require('./scripts/openSerpManager.cjs') 启动 OpenSerp 容器.
  # 之前只列 main.cjs + preload.cjs 会导致 asar 里没有 scripts/, 启动报
  # "Cannot find module './scripts/openSerpManager.cjs'".
  # 用白名单只打包 .cjs (运行时模块),避免把 .ps1/.mjs 构建脚本也打进安装包.
  - scripts/**/*.cjs

# 运行时资源(不打入 asar, 原样放到 resources/ 下)
extraResources:
  - from: build/icon.png
    to: build/icon.png
  - from: resources/backend
    to: backend
    filter:
      # --- 白名单: 包含所有文件 ---
      - "**/*"
      # --- 黑名单: 剔除无意义产物 ---
      # 文档 / 源码映射 / 编译中间产物
      - "!**/*.md"
      - "!**/*.map"
      - "!**/*.tsbuildinfo"
      - "!**/*.c"
      - "!**/*.h"
      - "!**/*.d.ts"
      - "!**/*.d.ts.map"
      - "!**/README*"
      - "!**/CHANGELOG*"
      - "!**/LICENSE*"
      # 测试 / 覆盖率
      - "!**/test/**"
      - "!**/__tests__/**"
      - "!**/tests/**"
      - "!**/coverage/**"
      - "!**/*.test.*"
      - "!**/*.spec.*"
      # 编辑器 / 构建 / Lock
      - "!**/.eslintrc*"
      - "!**/.prettierrc*"
      - "!**/.editorconfig"
      - "!**/.npmignore"
      - "!**/.gitignore"
      # puppeteer-core 默认会下载 Chromium, 桌面版用系统浏览器, 跳过 .local-chromium
      - "!**/.local-chromium/**"
      - "!**/node_modules/puppeteer/.local-chromium/**"
      # node_modules 内不必要的元数据
      - "!**/node_modules/.package-lock.json"
      - "!**/node_modules/.cache/**"
      - "!**/node_modules/.bin/*.cmd"
      # ---- 运行时 src 目录误删问题(debug@2.x / real-require@0.2.x) ----
      # 调试发现 debug 的 "main": "./src/index.js" (src/index.js 就是运行时入口,不是 TypeScript 源码);
      # real-require 同样 "files": ["src"] 几乎只发布 src/. 上一版这里写的是 "!**/src/**"
      # 把这两个包的运行时入口一起删了,后端报
      # "Cannot find module 'A:\\InsightForge\\resources\\backend\\node_modules\\debug\\src\\index.js'"。
      # 鱼与熊掌: 同样碰伤的还有 puppeteer-core/src (~1.21 MB) / openai/src (~1.13 MB)
      # / zod/src (~0.80 MB) — 这三个是纯 TypeScript 源码,运行时不用。
      # 考虑到仅 ~3 MB 的装包区别 vs 全量随手动增加 dev 依赖都会踩坑, 改为窄黑名单.
      - "!**/node_modules/puppeteer-core/src/**"
      - "!**/node_modules/openai/src/**"
      - "!**/node_modules/zod/src/**"
      # devtools-protocol/json (~1.53 MB Chromium DevTools 协议 JSON 定义) + pdl (~0.60 MB),
      # 仅类型生成器需要,运行时只读 .d.ts,不含可执行代码。
      - "!**/json/**"
      - "!**/pdl/**"
  - from: resources/frontend-dist
    to: frontend-dist
    filter:
      # --- 白名单: 包含所有文件 ---
      - "**/*"
      # --- 黑名单: Vite 默认产出的 source map 与无意义文件 ---
      # 之前漏了这里,index-*.js.map (~1.24 MB) 直接被装进安装包;
      # 用最小白名单 + 强黑名单(与 backend 那条一致)消除体腔。
      - "!**/*.map"
      - "!**/*.md"
      - "!**/README*"
      - "!**/CHANGELOG*"

# 顶层 compression: 控制 asar 压缩等级(仅当启用 asar 时生效;
# 本项目 main.cjs 是文件模式不打 asar,因此实际减小靠的是:
#   1) extraResources 的 file filter 严格过滤
#   2) backend 包移除 @mastra/core 等冗余依赖)
# 如未来主进程改用 asar,这里改 maximum 即可生效。

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # 直接喂 ICO, 跳过 electron-builder 自带的 PNG→ICO 转换路径.
  # (此前用 PNG + signAndEditExecutable:false 时, NSIS 安装包与便携 EXE
  # 都不会被 electron-builder 嵌入图标, 导致安装程序/桌面快捷方式显示
  # Electron 默认 logo; 用 ICO 直读更稳)
  icon: build/icon.ico
  artifactName: "${productName}-${version}-${arch}.${ext}"
  # signAndEditExecutable: false 跳过 electron-builder 内部 winCodeSign 调用;
  # 三产物 (win-unpacked/InsightForge.exe + dist/*.exe NSIS 安装包 +
  # dist/*-portable-x64.exe 便携包) 的图标嵌入
  # 统一交给 build.mjs 第 6/7 步, 用本地 rcedit-x64.exe 完成.
  # 跳过 winCodeSign 下载原因: winCodeSign-2.6.0.7z 从 GitHub 下载在国内网络下常失败
  signAndEditExecutable: false
  # 不对 exe 做代码签名(本项目暂未购买 EV 证书)
  signingHashAlgorithms: null
  sign: null

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: InsightForge
  # 关闭 -WX (NSIS warnings as errors): installer.nsh 在 generated .nsi
  # 顶部被 include, 位于 assistedInstaller.nsh 之前, 引用
  # $mui.InstFilesPage.ProgressBar 必然触发 warning 6000
  # "unknown variable/constant ... detected, ignoring".
  # 运行时这些变量已被 MUI2 + assistedInstaller.nsh 赋值, Function 运行正常.
  # 关 -WX 是允许 warning 继续编译的唯一解法 (见 installer.nsh 顶部说明).
  warningsAsErrors: false
  # 注入自定义 NSIS 钩子(桌面/installer.nsh).
  # 它提供 customInstall / customUnInstall / customInit 三个钩子宏,
  # 在文件复制收尾阶段(原本"突然跳到 100%"处)插入多步中文 DetailPrint,
  # 让详情文字持续滚动,缓和“忽快忽慢”体惑。
  # ⚠️ 它不能改变中段	(80MB+ File /r 复制)的 NSIS 进度条物理特性。
  include: installer.nsh
  # 显式指定 NSIS 安装器/卸载器图标, 与 win.icon 共用同一份 build/icon.ico,
  # 避免 electron-builder 缓存 png2icons 命中带来的图标残留.
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # 顶层 compression(默认 normal) 控制安装包整体压缩; NSIS 默认即 LZMA,
  # 不在 nsis 段单独配置 compression (24.x 已移除该字段)

portable:
  artifactName: "${productName}-${version}-portable-${arch}.${ext}"

electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
