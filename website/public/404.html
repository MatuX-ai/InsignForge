<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>404 · 页面不存在 · InsightForge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #0F172A;
        color: #F1F5F9;
        text-align: center;
        padding: 2rem;
      }
      .box { max-width: 480px; }
      .code {
        font-size: 6rem;
        font-weight: 800;
        background: linear-gradient(135deg, #6366F1, #A78BFA, #22D3EE);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        line-height: 1;
        margin: 0 0 1rem;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #94A3B8; margin: 0 0 2rem; }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        background: #6366F1;
        color: white;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.2s;
      }
      a:hover { background: #818CF8; }
    </style>
  </head>
  <body>
    <div class="box">
      <p class="code">404</p>
      <h1>页面不存在</h1>
      <p>你访问的链接可能已被移动或删除。回到首页继续浏览吧。</p>
      <a href="./">← 返回首页</a>
    </div>
  </body>
</html>
